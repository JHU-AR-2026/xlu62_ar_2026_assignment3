    const code = "// snapshot:index.js\nvar MODEL_URL = \"https://raw.githubusercontent.com/bellaa-a/AR_hw3/main/heart_in_love/scene.gltf\";\nvar MODEL_FORWARD_SIGN = -1;\nvar MODEL_SCALE = 1 / 100;\nvar SCALE_STEP = 5e-3;\nvar MIN_SCALE = 1e-3;\nvar MAX_SCALE = 0.1;\nvar ROTATION_SPEED = 2;\nvar createScene = async function() {\n  const scene = new BABYLON.Scene(engine);\n  const camera = new BABYLON.FreeCamera(\n    \"camera1\",\n    new BABYLON.Vector3(0, 1, -5),\n    scene\n  );\n  camera.setTarget(BABYLON.Vector3.Zero());\n  camera.attachControl(canvas, true);\n  const light = new BABYLON.HemisphericLight(\n    \"light\",\n    new BABYLON.Vector3(0, 1, 0),\n    scene\n  );\n  light.intensity = 0.9;\n  scene.useRightHandedSystem = true;\n  const xr = await scene.createDefaultXRExperienceAsync({\n    uiOptions: {\n      sessionMode: \"immersive-ar\"\n    },\n    optionalFeatures: true\n  });\n  const fm = xr.baseExperience.featuresManager;\n  try {\n    fm.disableFeature(\n      BABYLON.WebXRFeatureName.TELEPORTATION\n    );\n  } catch {\n  }\n  try {\n    fm.disableFeature(\n      BABYLON.WebXRFeatureName.MOVEMENT\n    );\n  } catch {\n  }\n  let activeContainer = null;\n  let latestHitPose = null;\n  let rightAxisX = 0;\n  let rightAxisY = 0;\n  let leftAxisX = 0;\n  let leftAxisY = 0;\n  const models = [];\n  const marker = BABYLON.MeshBuilder.CreateTorus(\n    \"marker\",\n    {\n      diameter: 0.06,\n      thickness: 0.01\n    },\n    scene\n  );\n  marker.isVisible = false;\n  marker.rotationQuaternion = new BABYLON.Quaternion();\n  function applyPoseToNode(pose, node) {\n    const {\n      position,\n      orientation\n    } = pose.transform;\n    node.position.set(\n      position.x,\n      position.y,\n      position.z\n    );\n    if (!node.rotationQuaternion) {\n      node.rotationQuaternion = new BABYLON.Quaternion();\n    }\n    node.rotationQuaternion.set(\n      orientation.x,\n      orientation.y,\n      orientation.z,\n      orientation.w\n    );\n  }\n  function getPlanarBasisFromCamera() {\n    const up = new BABYLON.Vector3(0, 1, 0);\n    const fwd = camera.getDirection(BABYLON.Axis.Z).normalize();\n    const fwdPlanar = fwd.subtract(\n      up.scale(\n        BABYLON.Vector3.Dot(fwd, up)\n      )\n    ).normalize();\n    let right = BABYLON.Vector3.Cross(up, fwdPlanar).normalize();\n    if (!isFinite(right.length()) || right.length() < 1e-3) {\n      right = new BABYLON.Vector3(1, 0, 0);\n    }\n    return {\n      fwdPlanar,\n      right\n    };\n  }\n  let prefabContainer = null;\n  let prefabReady = false;\n  try {\n    prefabContainer = await BABYLON.SceneLoader.LoadAssetContainerAsync(\n      \"\",\n      MODEL_URL,\n      scene\n    );\n    prefabContainer.meshes.forEach((m) => {\n      if (!m.rotationQuaternion) {\n        m.rotationQuaternion = BABYLON.Quaternion.Identity();\n      }\n      m.isVisible = false;\n      m.isPickable = false;\n    });\n    prefabContainer.transformNodes?.forEach((tn) => {\n      if (!tn.rotationQuaternion) {\n        tn.rotationQuaternion = BABYLON.Quaternion.Identity();\n      }\n    });\n    prefabReady = true;\n  } catch (e) {\n    console.error(\n      \"Could not load model:\",\n      e\n    );\n  }\n  function spawnModelAtPose(pose) {\n    if (!prefabReady || !prefabContainer) {\n      return null;\n    }\n    const container = new BABYLON.TransformNode(\n      \"model_\" + models.length,\n      scene\n    );\n    container.__spawnContainer = true;\n    container.rotationQuaternion = new BABYLON.Quaternion();\n    container.metadata = {\n      velPlanar: new BABYLON.Vector3(0, 0, 0),\n      velTarget: new BABYLON.Vector3(0, 0, 0),\n      // These will be filled after spawning\n      initialPosition: null,\n      initialRotation: null,\n      initialScale: null\n    };\n    const inst = prefabContainer.instantiateModelsToScene(\n      (name) => container.name + \"_inst_\" + name,\n      false\n    );\n    inst.rootNodes.forEach((rn) => {\n      rn.parent = container;\n      rn.setEnabled(true);\n      rn.getDescendants(false).forEach((n) => {\n        n.setEnabled?.(true);\n      });\n      if (!rn.rotationQuaternion) {\n        rn.rotationQuaternion = BABYLON.Quaternion.Identity();\n      }\n    });\n    inst.rootNodes.forEach((rn) => {\n      rn.getChildMeshes().forEach((m) => {\n        m.isVisible = true;\n        m.isPickable = true;\n        m.metadata = m.metadata || {};\n        m.metadata.__containerRef = container;\n      });\n    });\n    applyPoseToNode(\n      pose,\n      container\n    );\n    if (MODEL_FORWARD_SIGN === 1) {\n      const rot180Y = BABYLON.Quaternion.FromEulerAngles(\n        0,\n        Math.PI,\n        0\n      );\n      container.rotationQuaternion = rot180Y.multiply(\n        container.rotationQuaternion\n      );\n    }\n    const startPos = container.position.clone();\n    container.scaling.set(\n      1e-3,\n      1e-3,\n      1e-3\n    );\n    container.setEnabled(true);\n    const scaleAnim = new BABYLON.Animation(\n      \"spawnScale\",\n      \"scaling\",\n      60,\n      BABYLON.Animation.ANIMATIONTYPE_VECTOR3,\n      BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT\n    );\n    const posAnim = new BABYLON.Animation(\n      \"spawnPos\",\n      \"position\",\n      60,\n      BABYLON.Animation.ANIMATIONTYPE_VECTOR3,\n      BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT\n    );\n    scaleAnim.setKeys([\n      {\n        frame: 0,\n        value: new BABYLON.Vector3(\n          1e-3,\n          1e-3,\n          1e-3\n        )\n      },\n      {\n        frame: 6,\n        value: new BABYLON.Vector3(\n          MODEL_SCALE * 1.08,\n          MODEL_SCALE * 1.08,\n          MODEL_SCALE * 1.08\n        )\n      },\n      {\n        frame: 12,\n        value: new BABYLON.Vector3(\n          MODEL_SCALE,\n          MODEL_SCALE,\n          MODEL_SCALE\n        )\n      }\n    ]);\n    posAnim.setKeys([\n      {\n        frame: 0,\n        value: startPos.add(\n          new BABYLON.Vector3(\n            0,\n            0.02,\n            0\n          )\n        )\n      },\n      {\n        frame: 12,\n        value: startPos\n      }\n    ]);\n    const easing1 = new BABYLON.QuadraticEase();\n    easing1.setEasingMode(\n      BABYLON.EasingFunction.EASINGMODE_EASEOUT\n    );\n    const easing2 = new BABYLON.BackEase(0.8);\n    easing2.setEasingMode(\n      BABYLON.EasingFunction.EASINGMODE_EASEOUT\n    );\n    scaleAnim.setEasingFunction(easing2);\n    posAnim.setEasingFunction(easing1);\n    container.animations = [\n      scaleAnim,\n      posAnim\n    ];\n    scene.beginAnimation(\n      container,\n      0,\n      12,\n      false\n    );\n    container.metadata.initialPosition = startPos.clone();\n    container.metadata.initialRotation = container.rotationQuaternion.clone();\n    container.metadata.initialScale = new BABYLON.Vector3(\n      MODEL_SCALE,\n      MODEL_SCALE,\n      MODEL_SCALE\n    );\n    container.scaling.set(\n      MODEL_SCALE,\n      MODEL_SCALE,\n      MODEL_SCALE\n    );\n    models.push(container);\n    return container;\n  }\n  xr.input.onControllerAddedObservable.add(\n    async (controller) => {\n      controller.onMotionControllerInitObservable.add(async (motionController) => {\n        const handedness = motionController.handedness;\n        if (handedness === \"right\") {\n          const trigger = motionController.getComponent(\n            \"xr-standard-trigger\"\n          );\n          const thumbstick = motionController.getComponent(\n            \"xr-standard-thumbstick\"\n          );\n          const aButton = motionController.getComponent(\n            \"a-button\"\n          );\n          const bButton = motionController.getComponent(\n            \"b-button\"\n          );\n          if (thumbstick) {\n            thumbstick.onAxisValueChangedObservable.add((axes) => {\n              rightAxisX = axes.x || 0;\n              rightAxisY = axes.y || 0;\n            });\n            thumbstick.onButtonStateChangedObservable.add((state) => {\n              if (!state.pressed) {\n                rightAxisX = 0;\n                rightAxisY = 0;\n              }\n            });\n          }\n          if (aButton) {\n            aButton.onButtonStateChangedObservable.add((state) => {\n              if (state.changes.pressed && state.pressed && activeContainer) {\n                const currentScale = activeContainer.scaling.x;\n                const newScale = Math.min(\n                  MAX_SCALE,\n                  currentScale + SCALE_STEP\n                );\n                activeContainer.scaling.set(\n                  newScale,\n                  newScale,\n                  newScale\n                );\n              }\n            });\n          }\n          if (bButton) {\n            bButton.onButtonStateChangedObservable.add((state) => {\n              if (state.changes.pressed && state.pressed && activeContainer) {\n                const currentScale = activeContainer.scaling.x;\n                const newScale = Math.max(\n                  MIN_SCALE,\n                  currentScale - SCALE_STEP\n                );\n                activeContainer.scaling.set(\n                  newScale,\n                  newScale,\n                  newScale\n                );\n              }\n            });\n          }\n          if (trigger) {\n            trigger.onButtonStateChangedObservable.add((state) => {\n              if (state.changes.pressed && state.pressed && latestHitPose) {\n                const inst = spawnModelAtPose(\n                  latestHitPose\n                );\n                if (inst) {\n                  activeContainer = inst;\n                }\n              }\n            });\n          }\n          const session = xr.baseExperience.sessionManager.session;\n          const refSpace = xr.baseExperience.sessionManager.referenceSpace;\n          const hitTestSource = await session.requestHitTestSource({\n            space: controller.inputSource.targetRaySpace\n          });\n          const tmpDesired = new BABYLON.Vector3();\n          const tmpRight = new BABYLON.Vector3();\n          const tmpFwd = new BABYLON.Vector3();\n          xr.baseExperience.sessionManager.onXRFrameObservable.add((xrFrame) => {\n            const results = xrFrame.getHitTestResults(\n              hitTestSource\n            );\n            if (results.length) {\n              const pose = results[0].getPose(\n                refSpace\n              );\n              if (pose) {\n                latestHitPose = pose;\n                marker.isVisible = true;\n                applyPoseToNode(\n                  pose,\n                  marker\n                );\n              }\n            } else {\n              marker.isVisible = false;\n            }\n            if (activeContainer) {\n              let dt = scene.getEngine().getDeltaTime() / 1e3;\n              if (dt > 1 / 15) {\n                dt = 1 / 15;\n              }\n              const DEADZONE = 0.12;\n              const SPEED_MAX = 1.3;\n              const ACC_MAX = 5;\n              const FRICTION = 5;\n              const RESP_K = 12;\n              const basis = getPlanarBasisFromCamera();\n              tmpRight.copyFrom(\n                basis.right\n              );\n              tmpFwd.copyFrom(\n                basis.fwdPlanar\n              );\n              let ix = Math.abs(rightAxisX) < DEADZONE ? 0 : rightAxisX;\n              let iy = Math.abs(rightAxisY) < DEADZONE ? 0 : rightAxisY;\n              ix = -Math.sign(ix) * Math.pow(\n                Math.abs(ix),\n                3\n              );\n              iy = -Math.sign(iy) * Math.pow(\n                Math.abs(iy),\n                3\n              );\n              tmpDesired.copyFrom(tmpRight).scaleInPlace(\n                ix * SPEED_MAX\n              ).addInPlace(\n                tmpFwd.scale(\n                  iy * SPEED_MAX\n                )\n              );\n              const md = activeContainer.metadata;\n              const velTarget = md.velTarget;\n              const vel = md.velPlanar;\n              const alpha = 1 - Math.exp(\n                -RESP_K * dt\n              );\n              velTarget.x += (tmpDesired.x - velTarget.x) * alpha;\n              velTarget.y = 0;\n              velTarget.z += (tmpDesired.z - velTarget.z) * alpha;\n              const ax = (velTarget.x - vel.x) / dt;\n              const az = (velTarget.z - vel.z) / dt;\n              const aMag = Math.hypot(\n                ax,\n                az\n              );\n              const aCap = Math.min(\n                ACC_MAX,\n                aMag\n              );\n              const aScale = aMag > 1e-6 ? aCap / aMag : 0;\n              vel.x += ax * aScale * dt;\n              vel.z += az * aScale * dt;\n              const damp = Math.exp(\n                -FRICTION * dt\n              );\n              vel.x *= damp;\n              vel.z *= damp;\n              vel.y = 0;\n              activeContainer.position.addInPlace(\n                vel.scale(dt)\n              );\n              const ROT_DEADZONE = 0.12;\n              let rotateInput = Math.abs(leftAxisX) < ROT_DEADZONE ? 0 : leftAxisX;\n              if (rotateInput !== 0) {\n                rotateInput = Math.sign(rotateInput) * Math.pow(\n                  Math.abs(rotateInput),\n                  2\n                );\n                const rotationAmount = rotateInput * ROTATION_SPEED * dt;\n                activeContainer.rotate(\n                  BABYLON.Axis.Y,\n                  rotationAmount,\n                  BABYLON.Space.LOCAL\n                );\n              }\n            }\n          });\n        }\n        if (handedness === \"left\") {\n          const thumbstick = motionController.getComponent(\n            \"xr-standard-thumbstick\"\n          );\n          const xButton = motionController.getComponent(\n            \"x-button\"\n          );\n
